# Shared behavior, with remote-specific navigation and green dividers.
source-file ~/.config/tmux/ghostty.conf
bind-key P select-pane -t :.-
bind-key N select-pane -t :.+
bind-key F run-shell -C 'select-pane -t ":.#{pane-base-index}"'
bind-key L run-shell -C 'select-pane -t ":.#{e|+:#{pane-base-index},#{e|-:#{window_panes},1}}"'
# Publish edge flags over the existing terminal connection. Local tmux
# removes this prefix from the visible Ghostty window/tab title.
set -g set-titles-string '__gtr_#{==:#{pane_index},#{pane-base-index}}#{==:#{pane_index},#{e|+:#{pane-base-index},#{e|-:#{window_panes},1}}}__#{pane_title}'
set -g pane-active-border-style fg=colour34
# #00af00 over #1f1f1f: keep every remote pane green, brighten on focus.
set -g window-style bg=#1e251e
set -g window-active-style 'bg=#{?@ghostty_focused,#1d2b1d,#1e251e}'
