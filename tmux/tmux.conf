# Ghostty sends these prefix sequences from the Mac's Cmd shortcuts.
set -g prefix C-b
# While the managed SSH connection is active, forward to remote tmux.
# The SSH launcher sets this pane option and clears it when SSH returns.
bind-key D if-shell -F '#{@ghostty_remote}' 'send-keys C-b D' 'split-window -h -c "#{pane_current_path}"'
bind-key H if-shell -F '#{@ghostty_remote}' 'send-keys C-b H' 'split-window -v -c "#{pane_current_path}"'
bind-key X if-shell -F '#{@ghostty_remote}' 'send-keys C-b X' 'kill-pane'
# Remote tmux includes its first/last-pane flags in the terminal title.
# Use that cached state so cycling never starts a shell or an SSH request.
bind-key P if-shell -F '#{&&:#{@ghostty_remote},#{!=:#{m:__gtr_1?__*,#{pane_title}},1}}' {
    send-keys C-b P
} {
    select-pane -t :.-
    if-shell -F '#{@ghostty_remote}' { send-keys C-b L }
}
bind-key N if-shell -F '#{&&:#{@ghostty_remote},#{!=:#{m:__gtr_?1__*,#{pane_title}},1}}' {
    send-keys C-b N
} {
    select-pane -t :.+
    if-shell -F '#{@ghostty_remote}' { send-keys C-b F }
}
bind-key Q if-shell -F '#{@ghostty_remote}' 'send-keys C-b Q' 'detach-client'

# Behave like terminal panes: click to focus, drag dividers, scroll history.
set -g mouse on
set -g status off
set -g pane-active-border-style fg=colour214
# #ffaf00 blended over Dark Modern (#1f1f1f): 4% idle, 8% focused.
# The inner tmux supplies the green backgrounds for remote panes.
set -g window-style 'bg=#{?@ghostty_remote,default,#28251e}'
set -g window-active-style 'bg=#{?@ghostty_remote,default,#{?@ghostty_focused,#312b1d,#28251e}}'
set-hook -g pane-focus-in 'set-option -p @ghostty_focused 1'
set-hook -g pane-focus-out 'set-option -p @ghostty_focused 0'
# A shared remote layout must fit every simultaneously attached client.
set -g window-size smallest
set -g history-limit 100000
set -s escape-time 0
# Ghostty/outer tmux send prefix+key together; don't misclassify them as paste.
set -g assume-paste-time 0
set -g focus-events on
set -g default-terminal tmux-256color
set -as terminal-features ',xterm-ghostty:RGB:clipboard,tmux-256color:RGB:clipboard:title'
# Accept OSC 52 from the inner remote tmux and relay to Ghostty.
set -s set-clipboard on
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# Keep native tab titles useful even though tmux owns the shell.
set -g set-titles on
set -g set-titles-string '#{s/^__gtr_[01][01]__//:pane_title}'
